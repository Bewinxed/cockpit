<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link href="%sveltekit.assets%/favicon.png" rel="icon">
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
      name="viewport"
    >
    <title>Whiffle — mission control for Claude Code</title>
    <!--
      The two faces the first viewport is actually set in, fetched alongside the
      stylesheet rather than after it. Both are `font-display: swap`, so without
      this the page painted in the fallback and reflowed every line when the real
      faces landed (~1.45s on a cold load). TX-02 lives at a fixed path under
      `static/`, so it can be named here; Geist is a bundled asset whose URL Vite
      hashes, so its preload is emitted from the root layout, where the build can
      hand us the resolved name.
    -->
    <link
      as="font"
      crossorigin
      href="%sveltekit.assets%/fonts/TX-02-Regular.otf"
      rel="preload"
      type="font/otf"
    >
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!--
    THESIS: Whiffle answers "what is every agent doing, what needs me" in one
    glance, then one click deep. It refuses the stacked-form admin page and the
    stretched single column.
    OWN-WORLD: Apple x Airbnb. Warm-white canvas (warm charcoal at night),
    white surfaces floating on soft offset shadows, translucent chrome, one
    action olive, status tints (idle green / working amber / needs-you red),
    SF-stack UI type with size-specific tracking, TX-02 strictly for
    code/paths/data. Depth from elevation, not borders.
    STORY: the operator glances at the fleet board, sees what is blocked on
    them, acts with one key or click, drills into a live streaming transcript,
    spawns sessions into project folders, and leaves. Calm when idle; urgent
    only where urgency is real.
    FIRST VIEWPORT: attention strip on top (permissions/questions/blocked),
    live session board beneath it (state, machine, project, tool, context);
    sidebar of machines->projects->sessions left; spawn is compact and inline.
    Ultrawide adds a detail pane beside the board; iPhone recomposes to sheets
    and a thumb bar, never a shrunken desktop.
    FORM: user-pinned direction (Apple x Airbnb, 2026-08-07) superseding the
    rolled candidates; seed keys 7efd1737 / 98204eb5 recorded.
    FINISH: unreviewed and undocumented is unfinished; this build ends with
    the finish review, the verdict, and DESIGN.md.
    -->
    <!--
      The sidebar's width, before anything can paint it wrong.

      The rail is this browser's preference, not the fleet's, and it lives in
      localStorage — which the server cannot read. It is mirrored into a cookie
      so SSR usually gets it right, but a browser that has a width and no cookie
      (the migration case, and every fresh profile that has resized once) painted
      the default and snapped on hydration. Six lines here, before the body, and
      the first paint is already the stored width: `--rail-w` is what the rail's
      `--sidebar-width` resolves to, with the server's cookie value as the
      fallback. Shell.svelte owns the property from hydration onward.
    -->
    <script>
      "use strict";
      try {
        var w = Number.parseInt(localStorage.getItem("whiffle-rail-width"), 10);
        if (w >= 216 && w <= 520) {
          document.documentElement.style.setProperty("--rail-w", w + "px");
        }
      } catch (e) {
        /* No storage, or a value that is not a width: the cookie default stands. */
      }
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
