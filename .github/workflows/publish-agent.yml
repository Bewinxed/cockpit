name: Publish @agentdeck/agent to npm

on:
  push:
    branches:
      - main
    paths:
      - 'packages/agent-service/package.json'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          # Get current version
          CURRENT_VERSION=$(jq -r '.version' packages/agent-service/package.json)
          echo "Current version: $CURRENT_VERSION"

          # Get previous version from the commit before
          git show HEAD^:packages/agent-service/package.json > /tmp/prev-package.json 2>/dev/null || echo '{"version":"0.0.0"}' > /tmp/prev-package.json
          PREV_VERSION=$(jq -r '.version' /tmp/prev-package.json)
          echo "Previous version: $PREV_VERSION"

          # Compare versions
          if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
            echo "Version changed from $PREV_VERSION to $CURRENT_VERSION"
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build agent package
        working-directory: packages/agent-service
        run: bun run build:bundle

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        working-directory: packages/agent-service
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-v${{ needs.check-version.outputs.version }}
          name: "@agentdeck/agent v${{ needs.check-version.outputs.version }}"
          body: |
            ## @agentdeck/agent v${{ needs.check-version.outputs.version }}

            Install with:
            ```bash
            bunx @agentdeck/agent --hub-url wss://your-hub.example.com/ws/hub
            ```
          generate_release_notes: true
